[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable. It comes from gtk3-macros, which Tauri needs on Linux, and no upgrade exists." },
    { id = "RUSTSEC-2026-0592", reason = "Stack overflow in Url::origin() on a nested blob: URL, in url 2.5.8 from tauri and reqwest. Our code does not call Url::origin(). url 2.5.9 corrects it: run `cargo update -p url`, then remove this entry." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
